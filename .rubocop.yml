AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

# le module CLI concentre l'affichage du rapport
Metrics/ModuleLength:
  Exclude:
    - 'lib/claudel/cli.rb'
Metrics/ClassLength:
  Exclude:
    - 'lib/claudel/cli.rb'
